[/Script/Engine.RendererSettings]
r.DefaultFeature.Bloom=True
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Everything the viewer draws glows by itself (unlit, emissive), so Lumen has nothing to light: it only costs video memory, a long
; first shader compile and a distance field for every mesh. Global illumination off, reflections by screen space. To get Lumen
; back (the sky's rocks and ships then bounce light), set these to 1 and r.GenerateMeshDistanceFields to True.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.GenerateMeshDistanceFields=False
r.AntiAliasingMethod=4
r.DefaultFeature.MotionBlur=False

