name: Desktop builds

# Builds the Aether Brain desktop app installers.
#   - On pull requests touching the app: Windows build only, downloadable as a run artifact.
#   - Manually: Actions → "Desktop builds" → Run workflow → all three platforms.
#   - On a version tag (v0.1.0): also attaches the installers to a GitHub Release.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'aether-brain/**'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    working-directory: aether-brain

jobs:
  windows:
    name: Windows (.exe installer + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: aether-brain/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: aether-brain/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test + typecheck
        run: |
          pnpm test
          pnpm typecheck
      - name: Package
        run: pnpm --filter @aether/desktop dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: List artifacts
        shell: bash
        run: ls -la apps/desktop/release
      - uses: actions/upload-artifact@v4
        with:
          name: aether-brain-windows
          path: aether-brain/apps/desktop/release/*.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aether-brain/apps/desktop/release/*.exe
          generate_release_notes: true

  mac-linux:
    # PR builds stay Windows-only (the .exe is what people download).
    if: github.event_name != 'pull_request'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (.dmg)
            script: dist:mac
            artifact: aether-brain-macos
            files: |
              aether-brain/apps/desktop/release/*.dmg
              aether-brain/apps/desktop/release/*.zip
          - os: ubuntu-latest
            name: Linux (AppImage + deb)
            script: dist:linux
            artifact: aether-brain-linux
            files: |
              aether-brain/apps/desktop/release/*.AppImage
              aether-brain/apps/desktop/release/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: aether-brain/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: aether-brain/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test + typecheck
        run: |
          pnpm test
          pnpm typecheck
      - name: Package (${{ matrix.script }})
        run: pnpm --filter @aether/desktop ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: List artifacts
        run: ls -la apps/desktop/release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
