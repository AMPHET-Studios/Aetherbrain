name: Desktop builds

# Builds the Aether Brain desktop app installers.
#   - On pull requests touching the app: Windows build only, downloadable as a run artifact
#     (installer, portable .exe and the Claude Desktop extension aether-brain-<version>.mcpb).
#   - Every run of the Windows job also zips the Unreal version (AetherBrain-Unreal-<version>.zip: the Unreal project,
#     PackageWindows.bat and START-HERE.txt); a release carries it next to the installers.
#   - Manually (Actions → "Desktop builds" → Run workflow): all three platforms. Fill in the
#     "tag" input (e.g. v0.1.0) to also create that tag on main and publish a GitHub Release
#     with the installers attached.
#   - On a pushed version tag (v0.1.0): builds all platforms and attaches them to a Release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Create this tag on main and publish a GitHub Release (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''
  pull_request:
    paths:
      - 'aether-brain/**'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # The release tag for this run: the pushed tag, or the manual "tag" input, or empty.
  RELEASE_TAG: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name) || github.event.inputs.tag || '' }}

defaults:
  run:
    working-directory: aether-brain

jobs:
  tag:
    name: Tag main as ${{ github.event.inputs.tag }}
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create and push tag
        working-directory: .
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; reusing it."
          else
            git tag -a "$TAG" -m "Aether Brain $TAG"
            git push origin "refs/tags/$TAG"
            echo "Created $TAG at $(git rev-parse --short HEAD) on main."
          fi

  windows:
    name: Windows (.exe installer + portable)
    needs: [tag]
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || '' }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: aether-brain/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: aether-brain/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test + typecheck
        run: |
          pnpm --filter @aether/desktop build:mcp
          pnpm test
          pnpm typecheck
      - name: Package
        run: pnpm --filter @aether/desktop dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: List artifacts
        shell: bash
        run: ls -la apps/desktop/release
      # The Unreal version of Aether Brain: the Unreal project (open it in Unreal Engine 5.8, or double-click
      # PackageWindows.bat for a standalone .exe) with the steps in START-HERE.txt. Built on every run, so a pull
      # request shows it works; attached to the release below. Not built by CI itself: it needs the engine.
      - name: Zip the Unreal version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $d = Join-Path $env:RUNNER_TEMP "AetherBrain-Unreal-$v"
          New-Item -ItemType Directory -Force "$d/unreal", "$d/docs/img" | Out-Null
          Copy-Item unreal/AetherBrainViewer "$d/unreal/" -Recurse
          Copy-Item unreal/PackageWindows.bat, unreal/README.md "$d/unreal/"
          Copy-Item unreal/START-HERE.txt $d
          Copy-Item docs/UNREAL.md, docs/UNREAL-NIAGARA.md "$d/docs/"
          Copy-Item docs/img/unreal-*.png "$d/docs/img/"
          Compress-Archive -Path $d -DestinationPath "apps/desktop/release/AetherBrain-Unreal-$v.zip"
          Get-Item "apps/desktop/release/AetherBrain-Unreal-$v.zip" | Select-Object Name, Length
      # The installers plus the Claude Desktop extension (aether-brain-<version>.mcpb, built by
      # dist:win). Only this job ships the .mcpb, so the release gets exactly one copy.
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        # The account's artifact storage can fill up (each build is ~220 MB). A full
        # quota must not fail a good build: the release step below does not use it.
        continue-on-error: true
        with:
          name: aether-brain-windows
          path: |
            aether-brain/apps/desktop/release/*.exe
            aether-brain/apps/desktop/release/*.mcpb
            aether-brain/apps/desktop/release/AetherBrain-Unreal-*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Attach to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            aether-brain/apps/desktop/release/*.exe
            aether-brain/apps/desktop/release/*.mcpb
            aether-brain/apps/desktop/release/AetherBrain-Unreal-*.zip
          generate_release_notes: true

  mac-linux:
    # PR builds stay Windows-only (the .exe is what people download).
    needs: [tag]
    if: ${{ !cancelled() && needs.tag.result != 'failure' && github.event_name != 'pull_request' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (.dmg)
            script: dist:mac
            artifact: aether-brain-macos
            files: |
              aether-brain/apps/desktop/release/*.dmg
              aether-brain/apps/desktop/release/*.zip
          - os: ubuntu-latest
            name: Linux (AppImage + deb)
            script: dist:linux
            artifact: aether-brain-linux
            files: |
              aether-brain/apps/desktop/release/*.AppImage
              aether-brain/apps/desktop/release/*.deb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || '' }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: aether-brain/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: aether-brain/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test + typecheck
        run: |
          pnpm --filter @aether/desktop build:mcp
          pnpm test
          pnpm typecheck
      - name: Package (${{ matrix.script }})
        run: pnpm --filter @aether/desktop ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: List artifacts
        run: ls -la apps/desktop/release
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7
      - name: Attach to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ matrix.files }}
          # Release notes are generated once, by the Windows job; every job
          # that passes generate_release_notes appends another copy.
